name: Tests

on:
  push:
    branches: [main, refactor/reconcilehub-foundation]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend / TypeScript + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build


  e2e:
    name: E2E / critical workflows
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      RECONCILEHUB_DB_PATH: /tmp/reconcilehub-e2e/reconcile_hub.db
      RECONCILEHUB_ADMIN_PASSWORD: e2e-admin
      RECONCILEHUB_ENV: test
      RECONCILEHUB_E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Python E2E dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-e2e.txt
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start ReconcileHub
        run: |
          rm -rf /tmp/reconcilehub-e2e
          mkdir -p /tmp/reconcilehub-e2e
          uvicorn api:app --host 127.0.0.1 --port 8000 > /tmp/reconcilehub-e2e/server.log 2>&1 &
          echo $! > /tmp/reconcilehub-e2e/server.pid
      - name: Wait for API
        run: |
          python - <<'PY'
          import time
          import httpx

          url = "http://127.0.0.1:8000/api/health"
          deadline = time.monotonic() + 30
          last_error = None
          while time.monotonic() < deadline:
              try:
                  response = httpx.get(url, timeout=2.0)
                  if response.status_code == 200:
                      raise SystemExit(0)
                  last_error = RuntimeError(f"HTTP {response.status_code}: {response.text}")
              except Exception as exc:
                  last_error = exc
              time.sleep(0.5)
          raise SystemExit(f"Server did not become ready: {last_error}")
          PY
      - name: Run black-box E2E tests
        run: python -m pytest -q e2e
      - name: Upload E2E server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reconcilehub-e2e-server-log
          path: /tmp/reconcilehub-e2e/server.log
      - name: Stop ReconcileHub
        if: always()
        run: |
          if [ -f /tmp/reconcilehub-e2e/server.pid ]; then
            kill "$(cat /tmp/reconcilehub-e2e/server.pid)" || true
          fi
